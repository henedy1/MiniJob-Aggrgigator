<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minijob Radar</title>
    <style>
        :root {
            /* Slate-900 / Blue-500 Color Palette */
            --bg-base: #0f172a;
            --bg-surface: #1e293b;
            --bg-input: #334155;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #475569;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        svg {
            display: inline-block;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
            width: 100%;
        }

        /* --- HEADER & SETTINGS --- */
        header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header-content {
            padding: 1.25rem 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        @media (min-width: 768px) {
            .header-content {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand span {
            color: var(--accent);
        }

        .search-bar {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            flex-grow: 1;
            max-width: 800px;
        }

        @media (min-width: 768px) {
            .search-bar {
                flex-direction: row;
                align-items: center;
            }
        }

        .input-group {
            display: flex;
            align-items: center;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
            flex: 1;
        }

        .input-group:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .input-group svg {
            color: var(--text-secondary);
            margin-right: 0.5rem;
        }

        .input-group input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            width: 100%;
            outline: none;
            font-size: 0.875rem;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
        }

        .slider-group input[type="range"] {
            accent-color: var(--accent);
            width: 80px;
        }

        .btn {
            background-color: var(--accent);
            color: #fff;
            border: none;
            border-radius: 0.5rem;
            padding: 0.6rem 1.25rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background-color 0.2s;
            text-decoration: none;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        
        .btn-outline:hover {
            background-color: var(--bg-input);
            color: var(--text-primary);
        }

        /* Settings Bar */
        .settings-bar {
            background-color: rgba(15, 23, 42, 0.5);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 0;
            font-size: 0.8125rem;
        }

        .settings-content {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        @media (min-width: 640px) {
            .settings-content {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }

        .api-inputs {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        @media (min-width: 640px) {
            .api-inputs {
                flex-direction: row;
                align-items: center;
            }
        }

        .api-input {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.35rem 0.5rem;
            border-radius: 0.25rem;
            font-family: monospace;
            width: 200px;
        }

        .api-link {
            color: var(--accent);
            text-decoration: none;
        }

        .api-link:hover {
            text-decoration: underline;
        }

        /* --- MAIN CONTENT & STATES --- */
        main {
            padding: 2rem 0;
            flex: 1;
        }

        .status-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 1rem;
            background-color: var(--bg-surface);
            border-radius: 1rem;
            border: 1px dashed var(--border);
            margin-bottom: 2rem;
        }

        .hidden {
            display: none !important;
        }

        .spinner {
            width: 3rem;
            height: 3rem;
            border: 4px solid var(--bg-input);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-text {
            color: var(--danger);
            background-color: var(--danger-bg);
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--danger);
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- JOB GRID & CARDS --- */
        .meta-bar {
            margin-bottom: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .jobs-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 640px) {
            .jobs-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .jobs-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .job-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .job-card:hover {
            border-color: var(--accent);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        /* Opened/Viewed State */
        .job-card.viewed {
            opacity: 0.6;
            filter: grayscale(80%);
        }

        .job-card.viewed:hover {
            opacity: 0.9;
            filter: grayscale(0%);
        }

        .viewed-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background-color: var(--bg-input);
            color: var(--text-secondary);
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .job-title {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            line-height: 1.3;
            padding-right: 2rem;
            /* Prevent raw HTML injection issues if adzuna sends strong tags */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .job-company {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .job-details {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            flex-grow: 1;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .detail-item svg {
            color: var(--border);
        }
        
        .card-actions {
            margin-top: auto;
        }

        .card-actions .btn {
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Settings Bar (API Keys) -->
    <div class="settings-bar">
        <div class="container settings-content">
            <div class="api-inputs">
                <span style="color: var(--text-secondary);">Adzuna API:</span>
                <input type="text" id="appIdInput" class="api-input" placeholder="App ID">
                <input type="password" id="appKeyInput" class="api-input" placeholder="App Key">
                <button id="saveKeysBtn" class="btn btn-outline" style="padding: 0.35rem 0.75rem;">Save</button>
            </div>
            <div>
                <a href="https://developer.adzuna.com/" target="_blank" class="api-link">Get free keys at developer.adzuna.com &rarr;</a>
            </div>
        </div>
    </div>

    <!-- Main Header -->
    <header>
        <div class="container header-content">
            <div class="brand">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
                Minijob<span>Radar</span>
            </div>

            <div class="search-bar">
                <div class="input-group">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" id="keywordInput" placeholder="Extra keywords (e.g., English, Aushilfe)...">
                </div>

                <div class="input-group">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <input type="text" id="cityInput" placeholder="City or Zip" value="Gelsenkirchen">
                </div>

                <div class="slider-group">
                    <label for="radiusInput" style="color: var(--text-secondary);">Radius:</label>
                    <input type="range" id="radiusInput" min="0" max="100" value="25">
                    <span id="radiusValue" style="font-weight: 600; min-width: 45px; text-align: right;">25 km</span>
                </div>

                <button id="searchBtn" class="btn">Search</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        
        <!-- Status Container (Loading, Error, Empty) -->
        <div id="statusContainer" class="status-container hidden">
            <!-- Loading -->
            <div id="loadingState" class="hidden">
                <div class="spinner"></div>
                <p>Fetching jobs from Adzuna...</p>
            </div>
            
            <!-- Error -->
            <div id="errorState" class="hidden error-text">
                <h3 style="margin-bottom: 0.5rem; color: #fff;">Error Fetching Jobs</h3>
                <p id="errorMessage"></p>
            </div>

            <!-- Empty -->
            <div id="emptyState" class="hidden">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color: var(--border); margin-bottom: 1rem;">
                    <path d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                </svg>
                <h3 style="margin-bottom: 0.5rem;">No minijobs match your query</h3>
                <p style="color: var(--text-secondary);">Try expanding your search radius or changing keywords.</p>
            </div>
        </div>

        <!-- Meta Results Bar -->
        <div id="resultsMeta" class="meta-bar hidden">
            Found <strong id="resultsCount" style="color: #fff;">0</strong> minijobs in <strong id="resultsLocation" style="color: #fff;"></strong>
        </div>

        <!-- Jobs Grid -->
        <div id="jobsGrid" class="jobs-grid"></div>

    </main>

    <script>
        // --- State Management ---
        let app_id = '';
        let app_key = '';
        let viewedJobs = [];

        // --- DOM Elements ---
        const elAppId = document.getElementById('appIdInput');
        const elAppKey = document.getElementById('appKeyInput');
        const elSaveBtn = document.getElementById('saveKeysBtn');

        const elKeyword = document.getElementById('keywordInput');
        const elCity = document.getElementById('cityInput');
        const elRadius = document.getElementById('radiusInput');
        const elRadiusValue = document.getElementById('radiusValue');
        const elSearchBtn = document.getElementById('searchBtn');

        const elStatus = document.getElementById('statusContainer');
        const elLoading = document.getElementById('loadingState');
        const elError = document.getElementById('errorState');
        const elEmpty = document.getElementById('emptyState');
        const elErrorMsg = document.getElementById('errorMessage');
        
        const elMeta = document.getElementById('resultsMeta');
        const elCount = document.getElementById('resultsCount');
        const elLoc = document.getElementById('resultsLocation');
        const elGrid = document.getElementById('jobsGrid');

        // --- Initialization ---
        function init() {
            // Load API Keys
            const savedKeys = JSON.parse(localStorage.getItem('adzuna_keys'));
            if (savedKeys) {
                app_id = savedKeys.id;
                app_key = savedKeys.key;
                elAppId.value = app_id;
                elAppKey.value = app_key;
            }

            // Load Viewed Jobs
            viewedJobs = JSON.parse(localStorage.getItem('adzuna_viewed')) || [];

            // Event Listeners
            elSaveBtn.addEventListener('click', saveKeys);
            elSearchBtn.addEventListener('click', fetchJobs);
            elRadius.addEventListener('input', (e) => elRadiusValue.textContent = `${e.target.value} km`);
            elCity.addEventListener('keypress', (e) => { if (e.key === 'Enter') fetchJobs(); });
            elKeyword.addEventListener('keypress', (e) => { if (e.key === 'Enter') fetchJobs(); });

            // Trigger initial search if keys exist
            if (app_id && app_key) {
                fetchJobs();
            } else {
                showState('error', 'Please enter your Adzuna App ID and App Key in the top bar to start searching.');
            }
        }

        function saveKeys() {
            app_id = elAppId.value.trim();
            app_key = elAppKey.value.trim();
            localStorage.setItem('adzuna_keys', JSON.stringify({ id: app_id, key: app_key }));
            elSaveBtn.textContent = 'Saved!';
            setTimeout(() => elSaveBtn.textContent = 'Save', 2000);
            
            if(app_id && app_key) fetchJobs();
        }

        // --- UI State Management ---
        function showState(state, message = '') {
            elStatus.classList.remove('hidden');
            elLoading.classList.add('hidden');
            elError.classList.add('hidden');
            elEmpty.classList.add('hidden');
            elMeta.classList.add('hidden');
            elGrid.innerHTML = '';

            if (state === 'loading') {
                elLoading.classList.remove('hidden');
            } else if (state === 'error') {
                elError.classList.remove('hidden');
                elErrorMsg.textContent = message;
            } else if (state === 'empty') {
                elEmpty.classList.remove('hidden');
            } else if (state === 'success') {
                elStatus.classList.add('hidden');
                elMeta.classList.remove('hidden');
            }
        }

        // --- Fetch & Render Logic ---
        async function fetchJobs() {
            if (!app_id || !app_key) {
                showState('error', 'Missing Adzuna API Keys. Please enter them above.');
                return;
            }

            const city = elCity.value.trim() || 'Gelsenkirchen';
            const extraKeywords = elKeyword.value.trim();
            const radius = elRadius.value;
            
            // Build the 'what' query. Always include 'minijob'.
            const whatQuery = extraKeywords ? `minijob ${extraKeywords}` : 'minijob';

            // Construct Adzuna API URL (Germany endpoint /de/)
            const url = new URL('https://api.adzuna.com/v1/api/jobs/de/search/1');
            url.searchParams.append('app_id', app_id);
            url.searchParams.append('app_key', app_key);
            url.searchParams.append('results_per_page', '50');
            url.searchParams.append('what', whatQuery);
            url.searchParams.append('where', city);
            url.searchParams.append('distance', radius);

            showState('loading');

            try {
                const response = await fetch(url.toString(), {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                if (!response.ok) {
                    if (response.status === 403 || response.status === 401) {
                        throw new Error("Invalid App ID or App Key.");
                    }
                    throw new Error(`Server responded with status ${response.status}`);
                }

                const data = await response.json();
                const jobs = data.results || [];

                if (jobs.length === 0) {
                    showState('empty');
                    return;
                }

                elCount.textContent = jobs.length;
                elLoc.textContent = city;
                
                showState('success');
                renderGrid(jobs);

            } catch (error) {
                console.error("Fetch Error:", error);
                showState('error', error.message);
            }
        }

        function renderGrid(jobs) {
            elGrid.innerHTML = '';
            
            jobs.forEach(job => {
                const isViewed = viewedJobs.includes(job.id.toString());
                
                // Safely format data
                const title = job.title.replace(/<[^>]*>?/gm, ''); // Strip html tags Adzuna sometimes returns
                const company = job.company?.display_name || 'Direct Employer';
                const location = job.location?.display_name || 'Unknown Location';
                const date = new Date(job.created).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
                
                const card = document.createElement('div');
                card.className = `job-card ${isViewed ? 'viewed' : ''}`;
                card.id = `job-${job.id}`;

                card.innerHTML = `
                    ${isViewed ? `<div class="viewed-badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"></path></svg> Viewed</div>` : ''}
                    
                    <h2 class="job-title" title="${title}">${title}</h2>
                    
                    <div class="job-company">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                        ${company}
                    </div>

                    <div class="job-details">
                        <div class="detail-item">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                            ${location}
                        </div>
                        <div class="detail-item">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                            ${date}
                        </div>
                    </div>

                    <div class="card-actions">
                        <a href="${job.redirect_url}" target="_blank" rel="noopener noreferrer" class="btn ${isViewed ? 'btn-outline' : ''}" onclick="markAsViewed('${job.id}', event)">
                            ${isViewed ? 'Open Again' : 'Open Vacancy'}
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"></path></svg>
                        </a>
                    </div>
                `;

                elGrid.appendChild(card);
            });
        }

        // Global function to attach to inline onclick
        window.markAsViewed = function(id, event) {
            if (!viewedJobs.includes(id.toString())) {
                viewedJobs.push(id.toString());
                localStorage.setItem('adzuna_viewed', JSON.stringify(viewedJobs));
                
                // Update UI visually immediately
                const card = document.getElementById(`job-${id}`);
                if (card) {
                    card.classList.add('viewed');
                    const btn = card.querySelector('.btn');
                    btn.classList.add('btn-outline');
                    btn.innerHTML = `Open Again <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"></path></svg>`;
                    
                    // Add viewed badge if it doesn't exist
                    if (!card.querySelector('.viewed-badge')) {
                        const badge = document.createElement('div');
                        badge.className = 'viewed-badge';
                        badge.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"></path></svg> Viewed`;
                        card.insertBefore(badge, card.firstChild);
                    }
                }
            }
        };

        // Run setup
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
